name: Build Android AAB (Production)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.0)'
        required: true
        type: string
      submit:
        description: 'Auto-submit to Google Play Store'
        required: false
        type: boolean
        default: false

jobs:
  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set app version
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '${{ inputs.version }}';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "✅ Set version to ${{ inputs.version }}"

      - name: Build AAB
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Google Play Store
        if: ${{ inputs.submit }}
        run: eas submit --platform android --profile production --non-interactive
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Summary
        run: |
          echo "## 🤖 AAB Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-submit**: ${{ inputs.submit }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the AAB from the [Expo dashboard](https://expo.dev/accounts/vlmlokesh22/projects/codon/builds)" >> $GITHUB_STEP_SUMMARY


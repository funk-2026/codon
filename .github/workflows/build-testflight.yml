name: Build & Submit iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.0)'
        required: true
        type: string

jobs:
  build-testflight:
    name: Build & Submit to TestFlight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore App Store Connect API key
        run: |
          mkdir -p credentials
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > credentials/AuthKey_Y8T57F4ZRG.p8

      - name: Set app version
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '${{ inputs.version }}';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "✅ Set version to ${{ inputs.version }}"

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to TestFlight
        run: eas submit --platform ios --profile production --non-interactive

      - name: Summary
        run: |
          echo "## 🍎 TestFlight Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build has been submitted to TestFlight." >> $GITHUB_STEP_SUMMARY
          echo "It will appear in [App Store Connect](https://appstoreconnect.apple.com) once Apple finishes processing (usually 5-15 minutes)." >> $GITHUB_STEP_SUMMARY


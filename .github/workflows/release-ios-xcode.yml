name: Release iOS (Native Xcode)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Override Version Name (leave blank to use fe/.env IOS_VERSION_NAME)'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Override Build Number (leave blank to use fe/.env IOS_BUILD_NUMBER)'
        required: false
        type: string
        default: ''
      submit:
        description: 'Auto-submit to TestFlight / App Store (requires ASC API Key)'
        required: false
        type: boolean
        default: true

jobs:
  build-ios-xcode:
    name: Build iOS IPA via Xcode
    runs-on: macos-14
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version (>= 16.1 required by React Native)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
            if [ -n "$LATEST_XCODE" ]; then
              sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
            else
              sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
            fi
          fi
          echo "✅ Selected Xcode:"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Apply Version from fe/.env to Info.plist
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/apply-env-version.js ios

      - name: Setup App Store Connect API Key
        id: asc_key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_PLAIN: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -n "$ASC_KEY_BASE64" ] || [ -n "$ASC_KEY_PLAIN" ]; then
            KEY_ID="${ASC_KEY_ID:-Y8T57F4ZRG}"
            KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEY_DIR"
            KEY_FILE="$KEY_DIR/AuthKey_${KEY_ID}.p8"
            if [ -n "$ASC_KEY_BASE64" ]; then
              echo "$ASC_KEY_BASE64" | base64 -d > "$KEY_FILE"
            else
              echo "$ASC_KEY_PLAIN" > "$KEY_FILE"
            fi
            echo "has_asc_key=true" >> $GITHUB_OUTPUT
            echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
            echo "✅ Setup App Store Connect API key at $KEY_FILE"
          else
            echo "has_asc_key=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No ASC API key found in secrets"
          fi

      - name: Setup Apple Signing Certificate & Provisioning Profile (if provided)
        id: certs
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROV_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROV_BASE64" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/cert.p12
            echo "$P12_BASE64" | base64 -d > "$CERT_PATH"
            security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$PROV_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

            echo "has_signing_cert=true" >> $GITHUB_OUTPUT
            echo "✅ Installed Apple signing certificate and provisioning profile"
          else
            echo "has_signing_cert=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Using automatic signing / Xcode managed credentials"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build & Archive iOS App with Xcode
        id: xcodebuild
        run: |
          mkdir -p build

          # Use Xcode automatic provisioning with App Store Connect API key if available
          AUTH_FLAGS=""
          if [ "${{ steps.asc_key.outputs.has_asc_key }}" = "true" ] && [ -n "${{ secrets.ASC_API_KEY_ISSUER_ID }}" ]; then
            AUTH_FLAGS="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${{ steps.asc_key.outputs.key_id }}.p8 -authenticationKeyID ${{ steps.asc_key.outputs.key_id }} -authenticationKeyIssuerID ${{ secrets.ASC_API_KEY_ISSUER_ID }}"
          fi

          echo "Archiving workspace with xcodebuild..."
          xcodebuild archive \
            -workspace ios/Codon.xcworkspace \
            -scheme Codon \
            -configuration Release \
            -archivePath build/Codon.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            $AUTH_FLAGS

          echo "Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath build/Codon.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ios/ExportOptions.plist \
            $AUTH_FLAGS

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-ios-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}-ipa
          path: fe/build/Codon.ipa
          retention-days: 30

      - name: Upload to App Store Connect / TestFlight via xcrun
        if: ${{ inputs.submit && steps.asc_key.outputs.has_asc_key == 'true' }}
        env:
          KEY_ID: ${{ steps.asc_key.outputs.key_id }}
          ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          echo "Submitting Codon.ipa to App Store Connect..."
          xcrun altool --upload-app \
            -f build/Codon.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          echo "✅ Successfully submitted to TestFlight!"

      - name: Summary
        run: |
          echo "## 🍎 Native iOS Build (Xcode) Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ steps.version.outputs.version_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | \`${{ steps.version.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Tool** | Native Xcode (\`xcodebuild\`) on macOS runner |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`Codon.ipa\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Submit** | \`${{ inputs.submit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Download the \`Codon.ipa\` directly from the **Artifacts** section at the bottom of this run." >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.submit && steps.asc_key.outputs.has_asc_key == 'true' }}" = "true" ]; then
            echo "- The build was submitted directly to App Store Connect and will appear in [TestFlight](https://appstoreconnect.apple.com) shortly." >> $GITHUB_STEP_SUMMARY
          else
            echo "- You can upload this \`.ipa\` to App Store Connect using Apple's **Transporter** app or the \`xcrun altool\` CLI." >> $GITHUB_STEP_SUMMARY
          fi


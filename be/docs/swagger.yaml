      - Auth
  /api/v1/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verifies the OTP for a phone number. Creates the user if they are
        new (role=student). Enforces the two-device limit (3rd login evicts the oldest
        session). Returns a JWT access token.
      parameters:
      - description: OTP verification payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.verifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:

      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.KYCRecord'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get my KYC record
      tags:
      - KYC
    post:
      consumes:
      - application/json
      description: Submits identity verification for the authenticated student. The
        document must first be uploaded to S3 via /uploads/presign. Sets user kyc_status

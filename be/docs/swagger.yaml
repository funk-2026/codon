      parameters:
      - description: Restrict to a subject
        in: query
        name: subject_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Topic mastery map
      tags:
      - Analytics
  /api/v1/me/analytics/trend:
    get:
      description: Percentage score (score ÷ total marks) of the last N (default 20,
        max 100) submitted attempts, oldest first, optionally for one module.
      parameters:
      - description: qbank|test_series|practice|custom
        in: query
        name: module
        type: string
      - description: Default 20
        in: query
        name: limit

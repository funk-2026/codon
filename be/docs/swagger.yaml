            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: List published content items for a chapter (Student)
      tags:
      - Content
  /api/v1/content/{id}:
    get:
      description: Returns the details of a published content item plus a playable
        URL. Requires an active subscription (and approved KYC, if the platform requires
        it) when the item has requires_subscription set.
      parameters:
      - description: Content item UUID
        in: path
        name: id
        required: true

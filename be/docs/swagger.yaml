            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a single published content item (Student)
      tags:
      - Content
  /api/v1/courses:
    get:
      description: 'Returns the fixed set of 3 active courses: NEET UG, 9th Standard,
        10th Standard.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.listCoursesResponse'
      summary: List all courses
      tags:
      - Courses
  /api/v1/courses/{id}:
    get:
      description: Returns a single active course by its UUID.
      parameters:
      - description: Course UUID
        in: path

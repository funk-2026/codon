      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Score trend over the last attempts
      tags:
      - Analytics
  /api/v1/me/analytics/weak-areas:
    get:
      description: Chapters where the student has answered at least `analytics.min_answers`
        questions with accuracy below `analytics.weak_accuracy_threshold`, weakest

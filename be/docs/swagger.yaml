      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: How much of the question bank the student has seen
      tags:
      - Analytics
  /api/v1/me/analytics/mastery:
    get:
      description: 'Per chapter: how many distinct questions the student has answered,
        total answers, accuracy (correct ÷ answered), last practised date and a bucket

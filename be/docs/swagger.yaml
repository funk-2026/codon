      description: 'Verifies the uploaded object (real size, magic-byte sniffing —
        the declared content type is not trusted — dimensions, decompression-bomb
        guard), strips EXIF/GPS by re-encoding, generates the display (≤1600px) and
        thumbnail (≤400px) variants and returns the ready asset. A byte-identical
        re-upload by the same owner returns the existing asset. Rejections carry a
        `code`: too_large, too_large_dimensions, unsupported_type, corrupt_image.'
      parameters:

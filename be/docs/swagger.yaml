  /api/v1/attempts/{id}/answers:
    put:
      consumes:
      - application/json
      description: Applies up to 200 answer updates at once. Each item carries an
        optional client `answered_at`; an update older than what the server already
        has is ignored (last-write-wins). Returns a per-item result; one bad item
        never fails the batch.
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      - description: Answers
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.batchAnswersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Batch-sync answers (offline recovery)
      tags:
      - Attempts
  /api/v1/attempts/{id}/answers/{question_id}:
    put:
      consumes:
      - application/json
      description: 'Partial update of one answer inside an in-progress attempt. `selected_option:
        "A".."D"` sets it, `null` clears it; omitted fields are left untouched, so
        toggling `marked_for_review` never wipes the answer. The question must belong
        to the attempt''s test (422 `invalid_question`), the attempt must not be past
        its deadline (409 `attempt_expired`), and in tutor mode a revealed answer
        is locked (409 `answer_locked`).'
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      - description: Question UUID
        in: path
        name: question_id
        required: true
        type: string
      - description: Answer fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.upsertAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Save / update / clear an answer
      tags:
      - Attempts
  /api/v1/attempts/{id}/answers/{question_id}/reveal:
    post:
      description: Only valid for attempts started in tutor mode, after an answer
        has been selected. Locks the answer and returns the correct option and explanation
        for that single question. Exam-mode attempts get 403 `not_tutor_mode`.
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      - description: Question UUID
        in: path
        name: question_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_services.RevealResult'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Reveal the answer for one question (tutor mode)
      tags:
      - Attempts
  /api/v1/attempts/{id}/result:
    get:
      description: Scored summary for a submitted attempt plus a `breakdown` by subject,
        chapter and difficulty computed from question-level metadata. Accuracy = correct
        ÷ attempted.
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get attempt result
      tags:
      - Attempts
  /api/v1/attempts/{id}/review:
    get:
      description: Per-question review for a submitted attempt, ordered by question
        position. `filter` = all|correct|wrong|unattempted|marked|bookmarked. Without
        `limit` all items are returned (backwards compatible); with `limit` + `cursor`
        (the last `position` seen) it paginates. Rich-text fields come with a resolved
        `media` map.
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      - description: all|correct|wrong|unattempted|marked|bookmarked
        in: query
        name: filter
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Last position from the previous page
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get attempt review
      tags:
      - Attempts
  /api/v1/attempts/{id}/submit:
    post:
      consumes:
      - application/json
      description: Finalizes the attempt. The score is computed server-side from the
        test's marks settings. Unattempted questions score 0. Submitting after the
        deadline still works (the server clamps time taken to the test duration).
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true
        type: string
      - description: 'Optional: time taken in seconds'
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_handlers.submitAttemptRequest'
      produces:

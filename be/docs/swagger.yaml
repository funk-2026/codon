paths:
  /api/v1/admin/analytics:
    get:
      description: Returns analytics data for charts and stats, with computed deltas
        based on date ranges
      parameters:
      - default: 7D
        description: Time range (7D, 30D, All Time)
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.analyticsOverviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get admin analytics overview
      tags:
      - Admin
  /api/v1/admin/bookmark-collections:

            $ref: '#/definitions/internal_handlers.listAttemptsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: List my test attempts
      tags:
      - Profile
  /api/v1/me/bookmark-collections:
    get:
      description: The system collections (admin-configurable labels) plus any the

    properties:
      benefits:
        items:
          type: string
        type: array
      currency:
        type: string
      duration_days:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price_paise:
        type: integer
    type: object
  internal_handlers.updateRoleRequest:
    properties:
      role:
        enum:
        - student
        - teacher
        - admin
        example: teacher
        type: string
    type: object
  internal_handlers.updateSubjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
      order_index:
        type: integer
    type: object
  internal_handlers.updateTeacherPermissionsRequest:
    properties:
      can_manage_all_content:
        example: true
        type: boolean
    type: object
  internal_handlers.updateTestRequest:
    properties:
      chapter_id:
        type: string
      duration_minutes:
        type: integer
      marks_per_correct:
        type: number
      marks_per_wrong:
        type: number
      requires_subscription:
        type: boolean
      subject_id:
        type: string
      title:
        type: string
    type: object
  internal_handlers.updateWellnessRequest:
    properties:
      body_text:
        type: string
      is_active:
        type: boolean
      media_url:
        type: string
      title:
        type: string
    type: object
  internal_handlers.upsertAnswerRequest:
    properties:
      selected_option:
        enum:
        - A
        - B
        - C
        - D
        example: B
        type: string
    type: object
  internal_handlers.verifyOTPRequest:
    properties:
      device_id:
        example: device-uuid-abc
        type: string
      device_info:
        example: iPhone 14, iOS 17
        type: string
      otp_code:
        example: "482901"
        type: string
      phone_number:
        example: "+919876543210"
        type: string
    type: object
  internal_handlers.verifyOTPResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/codon-backend_internal_models.User'
    type: object
  internal_handlers.verifyPaymentRequest:
    properties:
      razorpay_order_id:
        example: order_Abc123
        type: string
      razorpay_payment_id:
        example: pay_Xyz789
        type: string
      razorpay_signature:
        example: abcdef1234...
        type: string
    type: object
  internal_handlers.webhookAckResponse:
    properties:
      status:
        example: ok
        type: string
    type: object

      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Publish an approved test (Teacher)
      tags:
      - Teacher
  /api/v1/teacher/tests/{id}/questions:
    post:
      consumes:
      - application/json
      description: Adds a single MCQ question to a draft test. The question is appended
        at the end (order_index auto-incremented). Correct option must be A, B, C,
        or D.
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      - description: Question details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.addQuestionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_models.Question'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Add a question to a test (Teacher)
      tags:
      - Teacher
  /api/v1/teacher/tests/{id}/submit-for-review:
    post:
      description: Transitions the test from draft or rejected state to pending_review.
        The test must have at least one question.
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'

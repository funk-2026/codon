      summary: List system bookmark collections (Admin)
      tags:
      - Bookmarks
  /api/v1/admin/bookmark-collections/{id}:
    patch:
      consumes:
      - application/json
      description: Deactivating moves its bookmarks to the first remaining active
        collection; the last active collection can't be deactivated.
      parameters:
      - description: Collection UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.patchCollectionRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.BookmarkCollection'
      security:
      - BearerAuth: []
      summary: Rename / reorder / deactivate a system collection (Admin)
      tags:
      - Bookmarks

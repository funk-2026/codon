      tags:
      - Teacher
  /api/v1/tests:
    get:
      description: Returns all published tests (Q Bank, Test Series, Practice) filterable
        by course, module type, and topic. Items with requires_subscription=true require
        an active subscription.
      parameters:
      - description: Filter by course UUID
        in: query
        name: course_id
        type: string
      - description: 'Filter by module type: qbank | test_series | practice'
        in: query
        name: module_type
        type: string
      - description: Filter by subject UUID
        in: query
        name: subject_id
        type: string
      - description: Filter by chapter UUID
        in: query
        name: chapter_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.listTestsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: List published tests
      tags:
      - Tests
  /api/v1/tests/{id}:
    get:
      description: Returns metadata for a single published test (no questions or answers
        included).
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.Test'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a test by ID
      tags:
      - Tests
  /api/v1/tests/{id}/attempts:
    post:
      description: Starts a new attempt for the given test. If the student already
        has an in-progress attempt on this test, the existing attempt is returned
        (resume). Subscription gating is checked before creation.
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.StudentAttempt'
        "403":
          description: Subscription required
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Start or resume a test attempt
      tags:
      - Attempts
  /api/v1/tests/{id}/questions:
    get:
      description: Returns the question text and options for a published test. Correct
        answers and explanations are NOT included (those are shown via /attempts/{id}/review
        after submission). Requires an in-progress attempt on this test.
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.testQuestionsResponse'
        "403":
          description: No active attempt
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Get test questions (requires active attempt)
      tags:
      - Tests
  /api/v1/uploads/presign:
    post:
      consumes:
      - application/json
      description: Returns a presigned S3 PUT URL valid for 15 minutes. The client
        uses this URL to upload the file directly to object storage without routing
        it through the backend. After upload, use the returned file_key when referencing
        the file in other API calls.
      parameters:
      - description: Upload details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.presignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.presignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Generate presigned upload URL
      tags:
      - Uploads
  /api/v1/webhooks/razorpay:
    post:
      consumes:
      - application/json
      description: Receives Razorpay webhook events. Verifies the X-Razorpay-Signature
        header before processing. Handles payment.captured (activates subscription)
        and payment.failed (marks record failed). Idempotent.
      parameters:
      - description: HMAC-SHA256 signature from Razorpay
        in: header
        name: X-Razorpay-Signature
        required: true
        type: string
      - description: Razorpay webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.razorpayWebhookBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.webhookAckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      summary: Razorpay webhook receiver
      tags:
      - Subscriptions & Payments

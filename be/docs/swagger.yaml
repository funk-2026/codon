          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "409":
          description: KYC already submitted or approved
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'

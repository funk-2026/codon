      tags:
      - Bookmarks
  /api/v1/me/bookmarks:
    get:
      description: 'Cursor-paginated. Filters: collection_id, item_type, subject_id,
        chapter_id, q. Questions come with their content; the answer key and explanation
        are included ONLY for questions the student has finished (submitted attempt)
        or revealed in tutor mode.'
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: My bookmarks
      tags:
      - Bookmarks
    put:
      consumes:
      - application/json
      description: Creates or moves a bookmark. Without `collection_id` the first
        system collection is used. For questions the student must have been exposed
        to the question in one of their attempts (403 `not_exposed`) so the pool can't
        be enumerated by guessing ids.
      parameters:
      - description: Bookmark
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.putBookmarkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.Bookmark'
      security:
      - BearerAuth: []
      summary: Bookmark an item (idempotent)
      tags:
      - Bookmarks
  /api/v1/me/bookmarks/{item_type}/{item_id}:

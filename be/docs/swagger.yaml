            $ref: '#/definitions/codon-backend_internal_models.StudentAttempt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Submit a test attempt
      tags:
      - Attempts
  /api/v1/attempts/{id}/takeover:
    post:
      description: An attempt is bound to the login session that started it. If it
        is open on another device, writes from this one fail with 409 `attempt_active_elsewhere`
        until this call moves it here.
      parameters:
      - description: Attempt UUID
        in: path
        name: id
        required: true

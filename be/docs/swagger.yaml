      tags:
      - Taxonomy
  /api/v1/custom-tests:
    get:
      description: 'Cursor-paginated. `state` filter: not_started | in_progress |
        completed. Each row carries the derived state, attempt count and last attempt
        summary. Archived tests are hidden.'
      parameters:
      - description: not_started|in_progress|completed
        in: query
        name: state
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: My custom tests
      tags:
      - CustomTests
    post:
      consumes:
      - application/json
      description: 'Selects questions server-side, freezes them (order, marks, mode,
        duration, blueprint) into a private test owned by the caller and returns it
        with any `relaxations` applied (never silent). The test then runs through
        the normal attempt endpoints. Send an `Idempotency-Key` header so a retried
        request returns the same test. Errors: `invalid_blueprint`, `pool_too_small`
        (with suggestions), `quota_exceeded` (free tier, with `resets_at`), `rate_limited`,
        `too_many_tests`.'
      parameters:
      - description: Client-generated key
        in: header
        name: Idempotency-Key
        type: string
      - description: Blueprint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/codon-backend_internal_blueprint.Blueprint'
      produces:
      - application/json
      responses:
        "200":
          description: replayed
          schema:
            $ref: '#/definitions/codon-backend_internal_generation.Result'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_generation.Result'
      security:
      - BearerAuth: []
      summary: Generate a custom test from a blueprint
      tags:
      - CustomTests
  /api/v1/custom-tests/{id}:
    delete:
      description: 'Soft delete: the test disappears from lists but its attempts,
        scores and analytics are kept. (The teacher DeleteTest path hard-deletes attempts
        and is deliberately not used here.)'
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
      security:
      - BearerAuth: []
      summary: Delete (archive) a custom test
      tags:
      - CustomTests
    get:
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: One custom test with its blueprint and attempts
      tags:
      - CustomTests
    patch:
      consumes:
      - application/json
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      - description: Title
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.renameRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.Test'
      security:
      - BearerAuth: []
      summary: Rename a custom test
      tags:
      - CustomTests
  /api/v1/custom-tests/{id}/regenerate:
    post:
      description: Runs the stored blueprint again with a new random seed and returns
        a NEW test. (Retaking the SAME questions is just starting another attempt
        on the same test — attempts are numbered `attempt_no`.)
      parameters:
      - description: Test UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_generation.Result'
      security:
      - BearerAuth: []
      summary: '"New set": same blueprint, fresh questions'
      tags:
      - CustomTests
  /api/v1/custom-tests/builder-config:
    get:
      description: 'Server-driven builder schema for one course and this user''s entitlement:
        the subject → chapter → topic tree with eligible question counts, difficulty
        levels with counts, status filters (and whether they are enabled), allowed
        sources, popular tags, limits, modes, marking presets, orders, strategies,
        system presets, entitlement/quota and feature flags. Cached ~60 s per (course,
        tier).'
      parameters:
      - description: Course UUID
        in: query
        name: course_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Everything the custom-test builder renders
      tags:
      - CustomTests
  /api/v1/custom-tests/count:
    post:
      consumes:
      - application/json
      description: Runs the same pool query as generation but persists nothing. Returns
        matches by subject and difficulty, the tightest filter (`bottleneck`) and
        ready-to-apply `suggestions` (each verified to increase the match count).
        Rate-limited per user. Free-tier requests report the clamped count (`clamped_to`).
      parameters:
      - description: Blueprint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/codon-backend_internal_blueprint.Blueprint'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_generation.CountResult'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Dry-run a blueprint: how many questions match?'
      tags:
      - CustomTests
  /api/v1/custom-tests/from-attempt/{attempt_id}:
    post:
      consumes:
      - application/json
      description: Builds a new custom test from the wrong and/or unattempted questions
        of one of the caller's submitted attempts. Eligibility and entitlement rules
        still apply (a question that was since held for review is skipped).
      parameters:
      - description: Attempt UUID
        in: path
        name: attempt_id
        required: true
        type: string
      - description: Options
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_handlers.fromAttemptRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_generation.Result'
      security:
      - BearerAuth: []
      summary: '"Practise my mistakes"'
      tags:
      - CustomTests
  /api/v1/custom-tests/share:
    post:
      consumes:
      - application/json
      description: The recipient receives the BLUEPRINT (filters, count, mode…), never
        the questions — they generate their own test. Codes expire after 30 days;
        bookmarks/status filters are personal, so they are stripped from what is shared.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Share a blueprint by short code
      tags:
      - CustomTests
  /api/v1/custom-tests/shared/{code}:
    get:
      description: Returns the blueprint for the app to pre-fill the builder. Re-validated
        against the current limits; 410 once expired.
      parameters:
      - description: Share code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Open a shared blueprint
      tags:
      - CustomTests
  /api/v1/custom-tests/templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: My saved blueprints (templates)
      tags:
      - CustomTests
    post:
      consumes:
      - application/json
      description: The blueprint is validated like a generation request; users may
        keep a limited number of templates (default 30).
      parameters:
      - description: Template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.templateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_models.CustomTestTemplate'
      security:
      - BearerAuth: []
      summary: Save a blueprint as a template
      tags:
      - CustomTests
  /api/v1/custom-tests/templates/{id}:
    delete:
      parameters:
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
      security:
      - BearerAuth: []
      summary: Delete a template
      tags:
      - CustomTests
    patch:
      consumes:
      - application/json
      parameters:
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.templateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.CustomTestTemplate'
      security:
      - BearerAuth: []
      summary: Rename or replace a template's blueprint
      tags:
      - CustomTests
  /api/v1/explore:
    get:
      description: 'One composite response for a course: `continue` (in-progress attempts),
        `recommended` (rule-based practice suggestions), `qbank` (chapters with the
        most eligible questions), `presets` (custom-test presets, when the module
        is enabled), `flashcard_decks` (newest and top-rated) and `brain_hacks` (newest).
        Sections that have nothing are empty arrays — the app hides them rather than
        showing placeholders.'
      parameters:
      - description: Course UUID
        in: query
        name: course_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Discovery feed for the Explore section
      tags:
      - Explore
  /api/v1/feedback:
    post:
      consumes:
      - application/json
      description: Submits a feedback entry from the authenticated user.
      parameters:
      - description: Feedback payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.submitFeedbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/codon-backend_internal_models.UserFeedback'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Submit feedback
      tags:
      - Feedback
  /api/v1/flashcards/cards/{id}/review:
    post:
      consumes:
      - application/json
      description: '`again` (due in 10 min, streak resets), `hard` (×1.2), `good`
        (1 d, then ×2), `easy` (3 d, then ×3); interval capped at 180 days. Counts
        toward the daily streak.'
      parameters:
      - description: Card UUID
        in: path
        name: id
        required: true
        type: string
      - description: Result
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.reviewCardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.FlashcardState'
      security:
      - BearerAuth: []
      summary: Grade a card (Student)
      tags:
      - Flashcards
  /api/v1/flashcards/decks:
    get:
      description: 'Filters: course_id, subject_id, chapter_id, q (title). `sort=rating`.
        Each deck carries `locked` (subscription), and the caller''s progress: new
        / due / learned cards. Decks the student can''t open are still listed (locked)
        so they can be discovered.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Browse published decks (Student)
      tags:
      - Flashcards
  /api/v1/flashcards/decks/{id}/cards:
    get:
      description: Ordered by position, cursor = last position. Subject to the deck's
        subscription rule.
      parameters:
      - description: Deck UUID
        in: path
        name: id
        required: true
        type: string
      - description: Last position
        in: query
        name: cursor
        type: integer
      - description: Default 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Browse all cards of a deck (Student)
      tags:
      - Flashcards
  /api/v1/flashcards/decks/{id}/study:
    get:
      description: Cards whose review is due (oldest first), then unseen cards in
        deck order, up to `limit` (default 20, max 50) — the deck's spaced-repetition
        queue.
      parameters:
      - description: Deck UUID
        in: path
        name: id
        required: true
        type: string
      - description: Default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Next cards to study in a deck (Student)
      tags:
      - Flashcards
  /api/v1/flashcards/quick:
    get:
      description: A short, time-boxed set (default 10, max 30) of due-then-new cards
        from decks the student can open, optionally limited to a course/chapter —
        distinct from a full Q Bank session.
      parameters:
      - description: Course UUID
        in: query
        name: course_id
        type: string
      - description: Chapter UUID
        in: query
        name: chapter_id
        type: string
      - description: Default 10
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Quick-questions session across decks (Student)
      tags:
      - Flashcards
  /api/v1/home/updates:
    get:
      description: Active items inside their optional start/end window, ordered. Empty

        type: string
      - description: Item UUID
        in: path
        name: item_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.messageResponse'
      security:
      - BearerAuth: []
      summary: Remove a bookmark (idempotent)

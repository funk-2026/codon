      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/codon-backend_internal_models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - Profile
  /api/v1/me/analytics/coverage:
    get:
      description: 'Distinct questions answered ÷ eligible questions, overall and
        per subject, for one course (entitlement-aware: free students are measured
        against the free pool).'
